<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" preserveAspectRatio="none">
  <defs>
    <linearGradient id="black-stock" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset=".48" stop-color="#050506"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <filter id="paper-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope=".28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="torn-edge" x="-5%" y="-18%" width="110%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .075" numOctaves="3" seed="23" result="fibers"/>
      <feDisplacementMap in="SourceGraphic" in2="fibers" scale="17" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="black-paper" x="-5%" y="-18%" width="110%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .09" numOctaves="3" seed="8" result="edge-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="edge-noise" scale="11" xChannelSelector="R" yChannelSelector="G" result="rough-edge"/>
      <feTurbulence type="fractalNoise" baseFrequency=".045 .16" numOctaves="3" seed="12" result="paper-grain"/>
      <feColorMatrix in="paper-grain" type="saturate" values="0" result="gray-grain"/>
      <feComponentTransfer in="gray-grain" result="subtle-grain">
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
      <feBlend in="rough-edge" in2="subtle-grain" mode="soft-light"/>
    </filter>
